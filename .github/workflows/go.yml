# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.25.5'

    - name: Build Linux
      run: GOOS=linux GOARCH=amd64 go build -o pglogalyze-linux ./cmd/pglogalyze

    - name: Build Windows
      run: GOOS=windows GOARCH=amd64 go build -o pglogalyze-windows.exe ./cmd/pglogalyze

    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          pglogalyze-linux
          pglogalyze-windows.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

